<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <title>JERES STUDIO - Toko & Kasir HP</title>
    <meta name="description" content="Aplikasi toko & kasir mobile minimalis dengan katalog menu, cetak nota invoice thermal, pencatatan customer otomatis, dan laporan penjualan lengkap." />
    <meta property="og:title" content="JERES STUDIO - Toko & Kasir HP" />
    <meta property="og:description" content="Aplikasi toko & kasir mobile minimalis dengan katalog menu, cetak nota invoice thermal, pencatatan customer otomatis, dan laporan penjualan lengkap." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('jeres_theme');
          if (!t) {
            var c = localStorage.getItem('jeres_cache_v1');
            if (c) {
              var parsed = JSON.parse(c);
              if (parsed && parsed.settings && parsed.settings.theme) {
                t = parsed.settings.theme;
              }
            }
          }
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0a0a0a';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#0a0a0a');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#fafafa';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
